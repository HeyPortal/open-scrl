name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # Only PR updates share a group; main and manual checks run independently.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun run verify
  e2e:
    name: Editor tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Upload editor test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: playwright-report/e2e/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser-test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts-${{ matrix.shard }}
          path: |
            test-results/e2e/
            playwright-report/e2e/
          if-no-files-found: ignore
          retention-days: 7
  pwa:
    name: PWA tests (${{ matrix.hosting }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hosting: root
            base-path: /
            report: pwa
          - hosting: pages
            base-path: /open-scrl/
            report: pwa-pages
    env:
      SCRL_BASE_PATH: ${{ matrix.base-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:pwa
      - name: Upload PWA test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pwa-timings-${{ matrix.hosting }}
          path: playwright-report/${{ matrix.report }}/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser-test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-failure-artifacts-${{ matrix.hosting }}
          path: |
            test-results/${{ matrix.report }}/
            playwright-report/${{ matrix.report }}/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    if: ${{ always() }}
    needs: [checks, e2e, pwa]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PWA_RESULT: ${{ needs.pwa.result }}
        run: |
          for result in "$CHECKS_RESULT" "$E2E_RESULT" "$PWA_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Verification blocked: checks=$CHECKS_RESULT, e2e=$E2E_RESULT, pwa=$PWA_RESULT"
              exit 1
            fi
          done
  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for the Pages URL and check the bundle
        run: bun run build && bun run bundle:check
        env:
          SCRL_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.VITE_GOOGLE_FONTS_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
